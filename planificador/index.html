<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador de videoclips</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <input id="title" type="text" class="title-input" aria-label="Título del proyecto" placeholder="Título">
  <button id="btn-audio" title="Cargar una canción">🎵 Cargar canción</button>
  <span id="audio-name" class="muted"></span>
  <label class="inline">BPM <input id="bpm" class="bpm-input" type="number" min="0" max="300" step="1" aria-label="BPM"></label>
  <button id="btn-tap" title="Pulsa al ritmo de la canción">Tap</button>
  <button id="btn-beat1" title="El primer tiempo de la canción está en la posición actual">1er beat aquí</button>
  <label class="inline"><input id="snap" type="checkbox"> Imán</label>
  <span class="grow"></span>
  <span id="stats" class="muted"></span>
  <button id="btn-undo" title="Deshacer (Ctrl+Z)">↶</button>
  <button id="btn-redo" title="Rehacer (Ctrl+Shift+Z)">↷</button>
  <span class="sep"></span>
  <button id="btn-new">Nuevo</button>
  <button id="btn-open">Abrir</button>
  <button id="btn-save">Guardar</button>
  <button id="btn-csv">CSV</button>
  <button id="btn-print">Imprimir</button>
</header>

<section id="monitor-panel" class="panel">
  <div id="monitor-stage"><div id="monitor-box"></div></div>
  <div class="mon-ctrl">
    <button id="btn-play" class="primary" title="Reproducir / pausa (Espacio)">▶</button>
    <span id="time-readout" class="mono">0:00.0 / 0:00.0</span>
    <span class="grow"></span>
    <button id="btn-cut-shot" title="Cortar plano (C)">✂ Cortar plano (C)</button>
    <button id="btn-cut-sec" title="Cortar sección (S)">✂ Sección (S)</button>
  </div>
</section>

<aside id="inspector" class="panel"></aside>

<section id="timeline-panel">
  <div id="tl-gutter">
    <div class="g-lbl" style="top:0;height:22px">Tiempo</div>
    <div class="g-lbl" style="top:22px;height:30px">Secciones</div>
    <div class="g-lbl" style="top:52px;height:78px">Planos</div>
    <div class="g-lbl" style="top:130px;height:80px">Audio</div>
    <div id="zoom-wrap"><span>Zoom</span><input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom"></div>
  </div>
  <div id="tl-scroll">
    <div id="tl-inner">
      <div id="beats"></div>
      <div class="row" id="row-ruler"></div>
      <div class="row" id="row-secs"></div>
      <div class="row" id="row-shots"></div>
      <div class="row" id="row-wave"><canvas id="wave-canvas"></canvas><div id="wave-hint">Carga una canción para ver la forma de onda (también puedes planificar sin ella)</div></div>
      <div id="playhead"></div>
    </div>
  </div>
</section>

<section id="bottom">
  <h1 id="print-title"></h1>
  <div class="tabs">
    <button class="tab active" data-tab="storyboard">Storyboard</button>
    <button class="tab" data-tab="rodaje">Lista de rodaje</button>
  </div>
  <div id="tab-storyboard" class="tabpane"></div>
  <div id="tab-rodaje" class="tabpane" hidden></div>
</section>

<div id="toast" role="status"></div>
<div id="tl-tip"></div>
<input id="audio-file" type="file" accept="audio/*" hidden>
<input id="json-file" type="file" accept=".json,application/json" hidden>
<audio id="player" preload="auto" hidden></audio>

<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/timeline.js"></script>
<script src="js/panels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
